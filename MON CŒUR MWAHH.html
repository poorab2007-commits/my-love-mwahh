<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Libre+Baskerville:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f1e6cf;
    --paper-dark: #e6d7b8;
    --ink: #3c2c22;
    --ink-soft: #6b5849;
    --terracotta: #b0492e;
    --sage: #6f7d5c;
    --mustard: #c99a3c;
    --rose: #c97b7e;
    --shadow: rgba(60, 44, 34, 0.25);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.15), transparent 55%),
      linear-gradient(135deg, #ddc9a3 0%, #cdb583 100%);
    font-family:'Libre Baskerville', Georgia, serif;
    color:var(--ink);
  }

  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 80px;
  }

  .stage{
    width:100%;
    max-width:680px;
  }

  .masthead{
    text-align:center;
    margin-bottom:22px;
    position:relative;
  }

  .masthead .kicker{
    font-family:'Special Elite', monospace;
    letter-spacing:0.35em;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(40px, 9vw, 64px);
    margin:6px 0 2px;
    color:var(--terracotta);
    letter-spacing:0.01em;
  }

  .masthead .sub{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    color:var(--ink-soft);
  }

  .tracker{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:16px 0 0;
  }
  .tracker .stamp-dot{
    width:11px;height:11px;border-radius:50%;
    border:1.5px solid var(--ink-soft);
    background:transparent;
    transition:all .3s ease;
  }
  .tracker .stamp-dot.filled{
    background:var(--sage);
    border-color:var(--sage);
  }

  .card{
    position:relative;
    background:var(--paper);
    background-image:
      radial-gradient(rgba(120,95,60,0.05) 1px, transparent 1px);
    background-size:3px 3px;
    border-radius:3px;
    padding:38px 34px 32px;
    margin-top:22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 18px 40px -12px var(--shadow),
      0 2px 6px rgba(60,44,34,0.15);
    border:1px solid rgba(60,44,34,0.12);
    animation:riseIn .5s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed rgba(60,44,34,0.18);
    pointer-events:none;
    border-radius:2px;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .locale{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .locale .icon{
    width:34px;height:34px;
    flex:0 0 auto;
    color:var(--terracotta);
  }
  .locale .label{
    font-family:'Special Elite', monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .chapter-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(24px, 5vw, 30px);
    color:var(--ink);
    margin:0 0 14px;
  }

  .body-text p{
    font-size:16.5px;
    line-height:1.75;
    margin:0 0 15px;
    color:var(--ink);
  }

  .body-text .letter-line{
    display:block;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
    color:var(--terracotta);
    margin:18px 0;
    padding:14px 18px;
    border-left:3px solid var(--rose);
    background:rgba(201,123,126,0.08);
  }

  .choices{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .choice-btn{
    font-family:'Libre Baskerville', serif;
    font-size:15.5px;
    text-align:left;
    background:var(--paper-dark);
    border:1.5px solid rgba(60,44,34,0.35);
    border-radius:2px;
    padding:14px 18px;
    cursor:pointer;
    color:var(--ink);
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    line-height:1.5;
  }
  .choice-btn::after{
    content:"✎";
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    opacity:0.35;
    font-size:14px;
  }
  .choice-btn:hover{
    background:#fffaf0;
    transform:translateX(3px);
    box-shadow:0 3px 10px rgba(60,44,34,0.15);
  }
  .choice-btn:focus-visible{
    outline:3px solid var(--sage);
    outline-offset:2px;
  }

  .continue-btn{
    font-family:'Special Elite', monospace;
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--terracotta);
    color:#fdf6e8;
    border:none;
    border-radius:2px;
    padding:14px 26px;
    cursor:pointer;
    margin-top:26px;
    display:inline-block;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 0 #7d3018;
  }
  .continue-btn:hover{
    transform:translateY(2px);
    box-shadow:0 2px 0 #7d3018;
  }
  .continue-btn:focus-visible{
    outline:3px solid var(--sage);
    outline-offset:2px;
  }

  .ending-seal{
    font-family:'Special Elite', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--sage);
    border:1.5px solid var(--sage);
    display:inline-block;
    padding:5px 12px;
    border-radius:2px;
    margin-bottom:16px;
    transform:rotate(-2deg);
  }

  .restart-wrap{
    text-align:center;
    margin-top:30px;
  }

  .restart-btn{
    font-family:'Special Elite', monospace;
    font-size:13px;
    letter-spacing:0.08em;
    background:none;
    border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);
    padding:11px 22px;
    border-radius:2px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .restart-btn:hover{
    background:var(--ink-soft);
    color:var(--paper);
  }

  .footer-note{
    text-align:center;
    font-family:'Special Elite', monospace;
    font-size:10.5px;
    color:rgba(60,44,34,0.45);
    margin-top:26px;
    letter-spacing:0.08em;
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .choice-btn:hover{transform:none;}
  }

  @media (max-width:480px){
    .card{padding:28px 20px 26px;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="masthead">
    <div class="kicker">a City Town story</div>
    <h1>City Town</h1>
    <div class="sub">five letters, one cat, and terrible timing</div>
    <div class="tracker" id="tracker"></div>
  </div>
  <div class="card" id="card"></div>
  <div class="footer-note">City Town runs on mountain air, mail carts, and questionable cat decisions.</div>
</div>

<script>
const ICONS = {
  home: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 22 L24 9 L40 22 V39 H30 V27 H18 V39 H8 Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>`,
  postoffice: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="17" width="36" height="24" rx="1" stroke="currentColor" stroke-width="2.2"/><path d="M6 19 L24 32 L42 19" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M17 10 H31 M24 10 V17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  jellyfish: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 22 a10 10 0 0 1 20 0 c0 5 -4 6 -10 6 s-10 -1 -10 -6 Z" stroke="currentColor" stroke-width="2.2"/><path d="M18 28 q0 6 -2 12 M24 28 v13 M30 28 q0 6 2 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  cow: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><ellipse cx="24" cy="26" rx="15" ry="11" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="22" r="2" fill="currentColor"/><circle cx="32" cy="22" r="2" fill="currentColor"/><path d="M12 18 q-3 -4 -6 -3 M36 18 q3 -4 6 -3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 30 q6 3 12 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  shop: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 18 L10 8 H38 L41 18" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M7 18 v21 h34 v-21" stroke="currentColor" stroke-width="2.2"/><path d="M7 18 a5 5 0 0 0 10 0 a5 5 0 0 0 10 0 a5 5 0 0 0 10 0 a5 5 0 0 0 4 -1" stroke="currentColor" stroke-width="2.2"/><rect x="20" y="27" width="8" height="12" stroke="currentColor" stroke-width="2.2"/></svg>`,
  cat: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 30 c0 -12 4 -18 12 -18 s12 6 12 18 c0 5 -5 8 -12 8 s-12 -3 -12 -8 Z" stroke="currentColor" stroke-width="2.2"/><path d="M15 15 L12 6 L20 12 M33 15 L36 6 L28 12" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="19" cy="27" r="1.6" fill="currentColor"/><circle cx="29" cy="27" r="1.6" fill="currentColor"/></svg>`,
  envelope: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="11" width="36" height="26" rx="1" stroke="currentColor" stroke-width="2.2"/><path d="M6 13 L24 28 L42 13" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>`
};

let state = {};
function freshState(){
  return {
    chapter: 'start',
    route: '',
    intercept: {1:null,2:null,3:null,4:null,5:null},
    confessFirst: false
  };
}
state = freshState();

const card = document.getElementById('card');
const tracker = document.getElementById('tracker');

function updateTracker(){
  let dots = '';
  for(let i=1;i<=5;i++){
    const got = state.intercept[i] === true;
    dots += `<div class="stamp-dot ${got ? 'filled' : ''}"></div>`;
  }
  tracker.innerHTML = dots;
}

function render(html){
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'riseIn .5s ease';
  card.innerHTML = html;
  updateTracker();
  window.scrollTo({top:0, behavior:'smooth'});
}

function locale(icon, label){
  return `<div class="locale">${ICONS[icon]}<div class="label">${label}</div></div>`;
}

function choiceButton(label, onclick){
  return `<button class="choice-btn" onclick="${onclick}">${label}</button>`;
}

// ---------- CHAPTERS ----------

function showStart(){
  updateTracker();
  render(`
    ${locale('home','City Town, senior year')}
    <h2 class="chapter-title">Somewhere on a Mountain</h2>
    <div class="body-text">
      <p>Every town has a story it tells about itself. City Town's is that it was never supposed to be this lively, this high up, this impossible to leave once you've stayed a while. Nobody remembers deciding that. It just happened, one flea market and one jellyfish cafe at a time.</p>
      <p>You are M.E. You are a lawyer now, freshly licensed, mostly by accident of persistence. You have a cat named Bento who has never once respected a closed door. And somewhere between your desk and the post office, five letters you never meant to send are currently on their way to the one person they were written for.</p>
    </div>
    <button class="continue-btn" onclick="showPrologue()">Open the shoebox</button>
  `);
}

function showPrologue(){
  render(`
    ${locale('home','the office')}
    <h2 class="chapter-title">The Shoebox</h2>
    <div class="body-text">
      <p>City Town sits halfway up a mountain that never got the memo it was supposed to be quiet. Somebody decided a village this high up needed jazz on Tuesday nights. Somebody else added a Sunday flea market that swallows three whole streets every week. Somebody, for reasons nobody has ever fully explained, opened a cafe with jellyfish tanks built straight into the walls, glowing soft blue after dark like the building itself is thinking about something. Up on the slopes above the rooftops, cows graze like the view belongs to them. Honestly, it might.</p>
      <p>The air stays warm most months. Not sticky warm. Just warm enough that a jacket feels optional right up until October proves everyone wrong at once.</p>
      <p>You moved back this year, Beninese by way of a childhood partly spent in France, though none of that matters much for what's about to happen. You are, on paper, a lawyer now, which mostly means you argue with strangers for a living and argue with yourself for free.</p>
      <p>Your office sits two doors down from a vintage shop you have been avoiding on purpose, called Le Grenier, French for the attic. It belongs to a boy named P, Indian, whose grandmother spoke French fluently from a chapter of her life she never explained in much detail, and taught it to him early enough that it stuck. She left him the shop. She was unimpressed by almost everyone except him.</p>
      <p>You've technically known P for six years, since year 8, though knowing is a generous word for it. You spent most of secondary school existing in the same hallways without much overlap, two people who said hi in passing and not a lot else. Year 12 changed that, a little. Year 13 changed it more. And it wasn't until last year that whatever this is actually started, properly, on purpose.</p>
      <p>It hasn't been smooth. You've blocked him three separate times since, over things so small you can no longer explain the third one with a straight face, and there is exactly one reason among them you still don't like thinking about. This year, slowly, you've been becoming friends again. Which is somehow worse, because now you actually like him, and you wrote five letters about it that were never, under any circumstances, supposed to leave your desk drawer.</p>
      <p>Enter Bento. Orange cat. The moral compass of a raccoon and the energy of a toddler who found the espresso machine. This morning, while you were in the shower rehearsing a closing argument to absolutely nobody, Bento knocked the shoebox of letters clean off your desk and into your open tote bag, which also happened to contain a certified legal notice due at the post office by noon.</p>
      <p>You grabbed the bag without looking. You handed the whole stack to the postal clerk without looking. You are now standing in your own office holding an empty shoebox, doing the kind of math lawyers are not trained for.</p>
    </div>
    <button class="continue-btn" onclick="showRoute()">Oh no.</button>
  `);
}

function showRoute(){
  render(`
    ${locale('postoffice','main street')}
    <h2 class="chapter-title">Five Letters, Moving</h2>
    <div class="body-text">
      <p>Five letters. Five very personal, increasingly unhinged letters, currently somewhere between the post office and Le Grenier, traveling toward P at a pace only the postal service fully understands. You grab your keys. Bento follows you out the door like he had nothing whatsoever to do with any of this.</p>
      <p>There are two ways to Main Street from here. One cuts straight past the shopfronts, faster, but it means walking directly by three separate vintage stores that all know you by name and none of which have ever respected a closed door either. The other goes up and over Mrs. Alarie's pasture, longer, muddier, and involving cows who consider foot traffic a personal insult.</p>
    </div>
    <div class="choices">
      ${choiceButton('Take Main Street, past the shopfronts', "chooseRoute('street')")}
      ${choiceButton('Cut through the pasture', "chooseRoute('pasture')")}
    </div>
  `);
}

function chooseRoute(r){
  state.route = r;
  showCh2();
}

function showCh2(){
  const flavor = state.route === 'pasture'
    ? 'You come down off the pasture path out of breath, one shoe already slightly damp, straight into the post office lobby.'
    : 'You cut past the vintage shopfronts, waving off two separate owners who try to show you a lamp, and land in the post office lobby out of breath.';
  render(`
    ${locale('postoffice','the post office')}
    <h2 class="chapter-title">Letter One</h2>
    <div class="body-text">
      <p>${flavor}</p>
      <p>The post office smells like paper and burnt coffee. You spot the outgoing cart just as the clerk starts wheeling it toward the door, a small stack of hand addressed envelopes on top, held together with a rubber band you're almost certain came off your own wrist last week.</p>
      <p>The top envelope is unmistakable. Your handwriting, several years younger and significantly more nervous, spells out one line before trailing into nothing.</p>
      <span class="letter-line">Remember that time I blocked you? Yeah, I...</span>
      <p>It just stops there. You remember exactly why. You were fifteen, furious, and had no idea how to finish that sentence honestly, so you folded it up and never did.</p>
    </div>
    <div class="choices">
      ${choiceButton('Grab it off the cart, no hesitation', "resolveIntercept(1, true)")}
      ${choiceButton("Freeze, because the clerk is P's aunt and this is mortifying", "resolveIntercept(1, false)")}
    </div>
  `);
}

function showCh3(){
  render(`
    ${locale('jellyfish','the jelly jar')}
    <h2 class="chapter-title">Letter Two</h2>
    <div class="body-text">
      <p>By the time you catch up, the mail cart has already made a stop nobody warned you about. Today's carrier is Theo, who has apparently decided the fastest route to Le Grenier runs directly through the Jelly Jar, City Town's one and only jellyfish cafe, because he wanted a lemonade and rules are for other people.</p>
      <p>Inside, the walls glow with tank light, jellyfish drifting around like they've never once been in a hurry about anything. Theo has set the mail bag down on a stool while he waits for his order, telling the barista a joke about how jellyfish never get stung by their own feelings. Nobody laughs except him.</p>
      <p>Sticking out of the top of the bag, envelope number two.</p>
      <span class="letter-line">Honestly your eyes, I can never stop looking into them.</span>
      <p>You wrote that after P walked you home in the rain and didn't make it weird for once, which for him is basically an Olympic event.</p>
    </div>
    <div class="choices">
      ${choiceButton("Slide it out while Theo isn't looking", "resolveIntercept(2, true)")}
      ${choiceButton('Just ask Theo for it outright', "resolveIntercept(2, false)")}
    </div>
  `);
}

function showCh4(){
  render(`
    ${locale('cow','the pasture')}
    <h2 class="chapter-title">Letter Three</h2>
    <div class="body-text">
      <p>Theo finishes his lemonade and heads out the shortcut way, straight through Mrs. Alarie's pasture, because apparently everyone in this town takes that shortcut except you. The cows, usually unbothered by mail carriers, take a sudden and specific interest in Theo's bag the second he sets it down to fix his shoelace.</p>
      <p>One cow, a large speckled creature named Debra by absolutely nobody but everyone at once, noses the bag clean over. Envelopes scatter into the grass. Debra chews thoughtfully on the corner of one before you can stop her.</p>
      <span class="letter-line">I really really love how you held my hand the other day.</span>
      <p>Envelope three, mostly intact, one corner slightly damp with cow.</p>
      <p>Somewhere behind you, a voice you'd know anywhere calls out that Debra has excellent taste in mail. It's not Theo. It's P, walking down from the shop with a coffee, no idea what's happening twenty feet from him. What do you call a cow with no legs, he adds, before you can stop him. Ground beef. He looks very proud of himself.</p>
    </div>
    <div class="choices">
      ${choiceButton('Dive for it before Debra finishes lunch', "resolveIntercept(3, true)")}
      ${choiceButton("Stay frozen so P doesn't see you", "resolveIntercept(3, false)")}
    </div>
  `);
}

function showCh5(){
  render(`
    ${locale('shop','outside le grenier')}
    <h2 class="chapter-title">Letter Four</h2>
    <div class="body-text">
      <p>P is closer now, close enough that hiding stops being a realistic legal strategy. He hasn't noticed the letters yet, too busy asking Theo why there's a cow eating his mail. Theo, gathering what's left of the bag, mentions there might be more where that came from.</p>
      <p>Envelope four sits right on top now, and you can already see the handwriting from here, because apparently past you had zero self preservation instincts. You wrote that one entirely in French, using a dictionary and a level of confidence you do not currently have access to.</p>
      <span class="letter-line">Mon coeur je t'aime. MWAH.</span>
      <p>P is maybe fifteen feet away. He is going to see it any second.</p>
    </div>
    <div class="choices">
      ${choiceButton('Sprint the last stretch and grab it first', "resolveIntercept(4, true)")}
      ${choiceButton('Panic and duck behind a very confused Debra', "resolveIntercept(4, false)")}
      ${choiceButton("Screw it. Walk up to him and just say it.", "chooseConfess()")}
    </div>
  `);
}

function showCh6(){
  render(`
    ${locale('shop','le grenier')}
    <h2 class="chapter-title">Letter Five</h2>
    <div class="body-text">
      <p>Somehow, someway, P still hasn't opened anything, mostly because Theo insists on doing things properly and hands deliveries over one at a time like an increasingly nervous auctioneer. The last envelope goes into P's hands now, you frozen about ten feet away mid stride, one shoe untied, dignity somewhere back in the pasture with Debra.</p>
      <span class="letter-line">Wanna go out?</span>
      <p>Yes or No, circle one, you'd written underneath, then, smaller: I already know what you're going to say, dork.</p>
      <p>P is holding it. He hasn't opened it yet. His thumb is already under the flap.</p>
    </div>
    <div class="choices">
      ${choiceButton('Call out and stop him before he opens it', "resolveIntercept(5, true)")}
      ${choiceButton('Let it happen. Own it.', "resolveIntercept(5, false)")}
    </div>
  `);
}

function chooseConfess(){
  state.confessFirst = true;
  showEnding();
}

function resolveIntercept(n, got){
  state.intercept[n] = got;
  if(n === 1) showCh3();
  else if(n === 2) showCh4();
  else if(n === 3) showCh5();
  else if(n === 4) showCh6();
  else if(n === 5) showEnding();
}

// ---------- ENDINGS ----------

function showEnding(){
  if(state.confessFirst) return endingConfess();
  const vals = [1,2,3,4,5].map(i => state.intercept[i]);
  const interceptedCount = vals.filter(v => v === true).length;
  const deliveredCount = 5 - interceptedCount;
  const onlyOne = state.intercept[1] === false && state.intercept[2] === true && state.intercept[3] === true && state.intercept[4] === true && state.intercept[5] === true;

  if(interceptedCount === 5) return endingZero();
  if(onlyOne) return endingOnlyOne();
  if(deliveredCount === 5) return endingMainB();
  return endingMainA();
}

function endingWrap(seal, title, icon, paragraphs){
  render(`
    ${locale(icon, 'le grenier')}
    <div class="ending-seal">${seal}</div>
    <h2 class="chapter-title">${title}</h2>
    <div class="body-text">
      ${paragraphs.join('')}
    </div>
    <div class="restart-wrap">
      <button class="restart-btn" onclick="restart()">Read it again</button>
    </div>
  `);
}

function endingConfess(){
  endingWrap('ending &middot; confession', 'Before the Words', 'shop', [
    `<p>You don't run the last fifteen feet so much as stumble through them, shoe still untied, dignity officially retired. P looks up from the envelope in his hand, sees your face, and whatever he was about to say about it completely leaves his head.</p>`,
    `<p>Before you can get a single word out, he beats you to it, all in one breath, the way people talk when they've been holding something in for far too long.</p>`,
